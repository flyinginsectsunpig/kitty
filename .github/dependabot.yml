version: 2
updates:
  # Keeps the SHA-pinned actions current (Dependabot updates the SHA and the version comment).
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: nuget
    directory: /
    schedule: { interval: weekly }
    groups:
      # The AppHost and every Aspire integration move together: mixing versions builds but doesn't run.
      aspire:
        patterns: ["Aspire.*"]
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    ignore:
      # TypeScript 7 drops the compiler API that openapi-typescript (the API client generator) needs.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
