name: images

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  ledger-tests:
    uses: ./.github/workflows/ledger.yml
  web-tests:
    uses: ./.github/workflows/web.yml
  ai-tests:
    uses: ./.github/workflows/ai.yml
  pulse-tests:
    uses: ./.github/workflows/pulse.yml

  build:
    # Only images whose tests passed are published (the runbook deploys :latest).
    needs: [ledger-tests, web-tests, ai-tests, pulse-tests]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: kitty-ledger
            dockerfile: services/ledger/Dockerfile
          - name: kitty-web
            dockerfile: apps/web/Dockerfile
          - name: kitty-ai
            dockerfile: services/ai/Dockerfile
          - name: kitty-pulse
            dockerfile: services/pulse/Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: tags
        run: |
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "image=ghcr.io/${owner}/${{ matrix.name }}" >> "$GITHUB_OUTPUT"
          echo "sha=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          # Oracle Always Free A1 is ARM; developer machines and CI are usually x86.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.tags.outputs.image }}:${{ steps.tags.outputs.sha }}
            ${{ steps.tags.outputs.image }}:latest
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  deploy-tag:
    # Points the server at the images just published: writes their sha- tag into deploy/values/production and commits
    # it to main; Argo CD rolls it out (deploy/k3s/RUNBOOK.md). Pushes made with GITHUB_TOKEN start no workflows, and
    # [skip ci] says so too: no loop.
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: deploy-tag
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0 # the newest-code-commit check walks past tag commits
      - name: Write the image tag and push it
        run: |
          # Each attempt starts from main as it is now and re-checks that this is still the newest code commit, so a
          # merge landing meanwhile is never overwritten with this older tag.
          for attempt in 1 2 3; do
            git fetch -q origin main && git reset -q --hard origin/main
            deploy/k3s/commit-image-tag.sh "$GITHUB_SHA"
            if git push origin HEAD:main; then exit 0; fi
            echo "main moved while writing the tag; trying again"
          done
          exit 1
