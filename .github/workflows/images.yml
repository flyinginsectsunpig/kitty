name: images

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  ledger-tests:
    uses: ./.github/workflows/ledger.yml
  web-tests:
    uses: ./.github/workflows/web.yml
  ai-tests:
    uses: ./.github/workflows/ai.yml

  build:
    # Only images whose tests passed are published (the runbook deploys :latest).
    needs: [ledger-tests, web-tests, ai-tests]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: kitty-ledger
            dockerfile: services/ledger/Dockerfile
          - name: kitty-web
            dockerfile: apps/web/Dockerfile
          - name: kitty-ai
            dockerfile: services/ai/Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: tags
        run: |
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "image=ghcr.io/${owner}/${{ matrix.name }}" >> "$GITHUB_OUTPUT"
          echo "sha=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          # Oracle Always Free A1 is ARM; developer machines and CI are usually x86.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.tags.outputs.image }}:${{ steps.tags.outputs.sha }}
            ${{ steps.tags.outputs.image }}:latest
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
