name: android

# A signed release APK of the Kitty app, built with Gradle on GitHub's runners (no Expo account needed).
# Run it by hand, or push a mobile-v* tag to also attach the APK to that tag's GitHub Release.
on:
  workflow_dispatch:
  push:
    tags: ["mobile-v*"]
    branches-ignore: [main]
    # A branch that changes the app (or what it's built from) proves it still builds.
    paths: [".github/workflows/android.yml", "apps/mobile/**", "packages/**", "pnpm-lock.yaml"]

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write # attach the APK to the tag's release
    env:
      # Where the app finds Kitty. Repository variables override these (Settings → Variables).
      EXPO_PUBLIC_WEB_URL: ${{ vars.EXPO_PUBLIC_WEB_URL || 'https://kitty-split.duckdns.org' }}
      EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL || 'https://kitty-split.duckdns.org/api' }}
      EXPO_PUBLIC_AUTH_ISSUER: ${{ vars.EXPO_PUBLIC_AUTH_ISSUER || 'https://kitty-split.duckdns.org/auth/realms/kitty' }}
    steps:
      - name: Signing secrets are set
        id: signing
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=""
          for name in KEYSTORE STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do [ -n "${!name}" ] || missing="$missing $name"; done
          if [ -z "$missing" ]; then echo "signed=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "signed=false" >> "$GITHUB_OUTPUT"
          # A release (a tag, or a run by hand) must carry the real signature. A branch run only proves the app still
          # builds, so without the secrets it signs with the debug key and publishes nothing.
          if [ "$GITHUB_EVENT_NAME" != "push" ] || [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "::error::Missing signing secrets:$missing (see apps/mobile/README.md)"; exit 1
          fi
          echo "::warning::No signing secrets:$missing. Building with the debug key to check the build; nothing is uploaded."

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 17
          # No `cache: gradle`: the Gradle files only exist after `expo prebuild`, so there is nothing to key it on here.
      - run: pnpm install --frozen-lockfile

      - name: Generate the Android project
        working-directory: apps/mobile
        run: pnpm exec expo prebuild --platform android --no-install --clean

      - name: Build and sign
        working-directory: apps/mobile/android
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          SIGNED: ${{ steps.signing.outputs.signed }}
        run: |
          if [ "$SIGNED" != "true" ]; then
            ./gradlew assembleRelease --no-daemon # the generated project signs release builds with the debug key
            exit 0
          fi
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.keystore"
          trap 'rm -f "$RUNNER_TEMP/release.keystore"' EXIT
          ./gradlew assembleRelease --no-daemon \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/release.keystore" \
            -Pandroid.injected.signing.store.password="$STORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"
          mv app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/kitty-${GITHUB_REF_NAME//\//-}.apk"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.signing.outputs.signed == 'true'
        with:
          name: kitty-apk
          path: ${{ runner.temp }}/kitty-*.apk
          if-no-files-found: error

      - name: Attach to the release
        if: steps.signing.outputs.signed == 'true' && startsWith(github.ref, 'refs/tags/mobile-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "Kitty app $GITHUB_REF_NAME" --notes "Android APK. Install by opening it on the phone (allow installs from this source)."
          gh release upload "$GITHUB_REF_NAME" "$RUNNER_TEMP"/kitty-*.apk --clobber
