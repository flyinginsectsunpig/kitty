name: android

# A signed release APK of the Kitty app, built with Gradle on GitHub's runners (no Expo account needed).
# Run it by hand, or push a mobile-v* tag to also attach the APK to that tag's GitHub Release.
on:
  workflow_dispatch:
  push:
    tags: ["mobile-v*"]
    branches-ignore: [main]
    paths: [".github/workflows/android.yml"] # lets a branch that changes this file prove it still builds

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write # attach the APK to the tag's release
    env:
      # Where the app finds Kitty. Repository variables override these (Settings → Variables).
      EXPO_PUBLIC_WEB_URL: ${{ vars.EXPO_PUBLIC_WEB_URL || 'https://kitty-split.duckdns.org' }}
      EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL || 'https://kitty-split.duckdns.org/api' }}
      EXPO_PUBLIC_AUTH_ISSUER: ${{ vars.EXPO_PUBLIC_AUTH_ISSUER || 'https://kitty-split.duckdns.org/auth/realms/kitty' }}
    steps:
      - name: Signing secrets are set
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=""
          for name in KEYSTORE STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do [ -n "${!name}" ] || missing="$missing $name"; done
          if [ -n "$missing" ]; then echo "::error::Missing signing secrets:$missing (see apps/mobile/README.md)"; exit 1; fi

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - run: pnpm install --frozen-lockfile

      - name: Generate the Android project
        working-directory: apps/mobile
        run: pnpm exec expo prebuild --platform android --no-install --clean

      - name: Build and sign
        working-directory: apps/mobile/android
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.keystore"
          ./gradlew assembleRelease --no-daemon \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/release.keystore" \
            -Pandroid.injected.signing.store.password="$STORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"
          rm "$RUNNER_TEMP/release.keystore"
          mv app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/kitty-${GITHUB_REF_NAME//\//-}.apk"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kitty-apk
          path: ${{ runner.temp }}/kitty-*.apk
          if-no-files-found: error

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/mobile-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "Kitty app $GITHUB_REF_NAME" --notes "Android APK. Install by opening it on the phone (allow installs from this source)."
          gh release upload "$GITHUB_REF_NAME" "$RUNNER_TEMP"/kitty-*.apk --clobber
