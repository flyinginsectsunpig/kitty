name: ledger

on:
  workflow_call: # images.yml runs these before publishing
  push:
    branches: [main]
    paths: ["services/ledger/**", "aspire/**", "contracts/**", "Directory.*.props", "global.json", ".github/workflows/ledger.yml"]
  pull_request:
    paths: ["services/ledger/**", "aspire/**", "contracts/**", "Directory.*.props", "global.json", ".github/workflows/ledger.yml"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - name: Unit and integration tests (Testcontainers)
        run: dotnet test --solution Kitty.slnx
