name: web

on:
  workflow_call: # images.yml runs these before publishing
  push:
    branches: [main]
    paths: ["apps/**", "packages/**", "contracts/**", "services/ledger/**", "pnpm-lock.yaml", ".github/workflows/web.yml"]
  pull_request:
    paths: ["apps/**", "packages/**", "contracts/**", "services/ledger/**", "pnpm-lock.yaml", ".github/workflows/web.yml"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck
      - run: pnpm -r test
      - run: pnpm --filter web build
      - name: Mobile bundle builds (no native toolchain needed)
        run: pnpm --filter mobile export

  contract-drift:
    # The committed OpenAPI document and the generated TypeScript client must match the ledger.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: OpenAPI document is current
        run: dotnet test --project services/ledger/tests/Kitty.Ledger.IntegrationTests -- --filter-class "*OpenApiTests"
      - name: TypeScript client is current
        run: |
          pnpm --filter @kitty/api-client generate
          git diff --exit-code packages/api-client/src/schema.d.ts
