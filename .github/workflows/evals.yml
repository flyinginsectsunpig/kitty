name: evals

# Receipt-reading accuracy against labelled receipts. Nightly and on demand only: it calls the model's free
# tier, so it never runs on pull requests.
on:
  workflow_dispatch:
    inputs:
      limit:
        description: Receipts to score
        default: "50"
  schedule:
    - cron: "17 2 * * *"

permissions:
  contents: read

jobs:
  receipts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ai
    env:
      AI_GEMINI_API_KEY: ${{ secrets.AI_GEMINI_API_KEY }}
    steps:
      - name: Skip without a model key
        if: env.AI_GEMINI_API_KEY == ''
        working-directory: .
        run: echo "::notice::AI_GEMINI_API_KEY is not set; receipt evals skipped."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.AI_GEMINI_API_KEY != ''
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        if: env.AI_GEMINI_API_KEY != ''
        with:
          version: "0.12.24"
      - if: env.AI_GEMINI_API_KEY != ''
        run: uv sync --frozen --no-dev
      - name: Models this key can use
        # Names only (never the key): shows at a glance when the configured model has been renamed or retired.
        if: env.AI_GEMINI_API_KEY != ''
        run: >-
          uv run python -c "import os; from google import genai;
          c = genai.Client(api_key=os.environ['AI_GEMINI_API_KEY']);
          print('\n'.join(sorted(m.name for m in c.models.list() if 'generateContent' in (m.supported_actions or []))))"
      - name: Fetch the bootstrap set (CORD-v2)
        if: env.AI_GEMINI_API_KEY != ''
        run: uv run python evals/fetch_cord.py --out "$RUNNER_TEMP/cord" --limit "${{ inputs.limit || '50' }}"
      - name: Score
        if: env.AI_GEMINI_API_KEY != ''
        run: uv run python evals/run_receipts.py --data "$RUNNER_TEMP/cord" --min-total-accuracy 0.9
