name: ai

on:
  workflow_call: # images.yml runs these before publishing
  push:
    branches: [main]
    paths: ["services/ai/**", "contracts/**", ".github/workflows/ai.yml"]
  pull_request:
    paths: ["services/ai/**", "contracts/**", ".github/workflows/ai.yml"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ai
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.12.24"
      - run: uv sync --frozen
      - name: Lint
        run: uv run ruff check && uv run ruff format --check
      - name: Generated contracts match contracts/proto
        run: |
          uv run python scripts/gen_contracts.py
          git diff --exit-code -- src/kitty_ai/contracts
      - name: Tests (real OCR; Redpanda, Azurite and Postgres via Testcontainers)
        run: uv run pytest
