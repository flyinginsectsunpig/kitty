syntax = "proto3";

package kitty.notify.v1;

import "google/protobuf/timestamp.proto";

option csharp_namespace = "Kitty.Contracts.Notify.V1";
option go_package = "github.com/flyinginsectsunpig/kitty/services/pulse/gen/kitty/notify/v1;notifyv1";

// One person should be told something. Written by the ledger in the same transaction as the change.
// Topic notifications.requested, keyed by user id. pulse applies the person's settings and delivers it.
message NotificationRequested {
  enum Kind {
    KIND_UNSPECIFIED = 0;
    KIND_EXPENSE_ADDED = 1;
    KIND_PAYMENT = 2;
    KIND_WEEKLY_SUMMARY = 3;
  }
  // Delivery is once per (notification_id, channel).
  string notification_id = 1;
  string user_id = 2;
  Kind kind = 3;
  string title = 4;
  string body = 5;
  // Where tapping it goes, e.g. kitty://groups/{id}.
  string link = 6;
  // Empty for the weekly summary.
  string group_id = 7;
  google.protobuf.Timestamp occurred_at = 8;
}

// One person's full delivery state after any change. Topic ledger.notify-settings (log-compacted), keyed by user id.
message NotifySettingsChanged {
  string user_id = 1;
  // A verified address, or empty.
  string email = 2;
  bool expense_push = 3;
  bool expense_email = 4;
  bool payment_push = 5;
  bool payment_email = 6;
  bool weekly_push = 7;
  bool weekly_email = 8;
  repeated string push_tokens = 9;
  // Higher wins.
  int64 version = 10;
}
