syntax = "proto3";

package kitty.recurring.v1;

import "google/protobuf/timestamp.proto";

option csharp_namespace = "Kitty.Contracts.Recurring.V1";
option go_package = "github.com/flyinginsectsunpig/kitty/services/pulse/gen/kitty/recurring/v1;recurringv1";

// A recurring schedule's full timing state after any change. Topic ledger.recurring (log-compacted), keyed by
// schedule id, so the latest message per schedule is all a consumer needs.
message RecurringScheduleChanged {
  enum Frequency {
    FREQUENCY_UNSPECIFIED = 0;
    FREQUENCY_WEEKLY = 1;
    FREQUENCY_MONTHLY = 2;
  }
  string event_id = 1;
  google.protobuf.Timestamp occurred_at = 2;
  string schedule_id = 3;
  string group_id = 4;
  // The rule comes from the start date: weekly on its weekday, monthly on its day of the month.
  Frequency frequency = 5;
  // YYYY-MM-DD.
  string starts_on = 6;
  // YYYY-MM-DD, or empty for no end.
  string ends_on = 7;
  // YYYY-MM-DD: periods before this are never added (the start date, or the day it was resumed).
  string not_before = 8;
  bool paused = 9;
  bool deleted = 10;
  // Higher wins: a consumer ignores anything older than what it has.
  int32 version = 11;
}
