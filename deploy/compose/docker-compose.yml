# Kitty on one machine (Oracle Always Free A1, 2 OCPU / 12 GB). See RUNBOOK.md.
# Run from the repository root:  docker compose -f deploy/compose/docker-compose.yml --env-file deploy/compose/.env up -d
name: kitty

x-restart: &restart
  restart: unless-stopped

services:
  postgres:
    <<: *restart
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ledger
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres-init.sql:/docker-entrypoint-initdb.d/10-keycloak.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ledger"]
      interval: 10s
      retries: 10
    deploy:
      resources: { limits: { memory: 1g } }

  keycloak:
    <<: *restart
    image: quay.io/keycloak/keycloak:26.6
    command: ["start", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: postgres
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KC_HTTP_ENABLED: "true" # TLS ends at Caddy
      KC_HTTP_RELATIVE_PATH: /auth
      KC_HOSTNAME: https://${KITTY_HOST:?set KITTY_HOST}/auth
      # The admin console is not exposed publicly; reach it through an SSH tunnel (RUNBOOK.md).
      KC_HOSTNAME_ADMIN: http://localhost:8180/auth
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set KEYCLOAK_ADMIN_PASSWORD}
      # Placeholders substituted into kitty-realm.json on first import:
      KITTY_PUBLIC_URL: https://${KITTY_HOST}
      KITTY_WEB_CLIENT_SECRET: ${KITTY_WEB_CLIENT_SECRET:?set KITTY_WEB_CLIENT_SECRET}
      KITTY_VERIFY_EMAIL: ${KITTY_VERIFY_EMAIL:-true}
      SMTP_HOST: ${SMTP_HOST:-smtp.resend.com}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_FROM: ${SMTP_FROM:?set SMTP_FROM}
      SMTP_AUTH: "true"
      SMTP_USER: ${SMTP_USER:-resend}
      SMTP_PASSWORD: ${SMTP_PASSWORD:?set SMTP_PASSWORD}
      SMTP_SSL: ${SMTP_SSL:-true}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-false}
      GOOGLE_ENABLED: ${GOOGLE_ENABLED:-false}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-unset}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-unset}
    volumes:
      - ../../infra/keycloak/kitty-realm.json:/opt/keycloak/data/import/kitty-realm.json:ro
    ports:
      - "127.0.0.1:8180:8080" # admin access via SSH tunnel only
    depends_on:
      postgres: { condition: service_healthy }
    deploy:
      resources: { limits: { memory: 1g } }

  redis:
    <<: *restart
    image: redis:7.4-alpine
    # Only carries live-update messages between ledger instances: nothing to persist.
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "48mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      retries: 10
    deploy:
      resources: { limits: { memory: 64m } }

  redpanda:
    <<: *restart
    # Kafka API + schema registry, one broker. Carries receipt scans to the ai service and results back.
    image: docker.redpanda.com/redpandadata/redpanda:v26.2.6
    command:
      - redpanda
      - start
      - --smp=1
      - --memory=1G
      - --reserve-memory=0M
      - --overprovisioned
      - --node-id=0
      - --check=false
      - --kafka-addr=PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr=PLAINTEXT://redpanda:9092
      - --schema-registry-addr=0.0.0.0:8081
      - --rpc-addr=0.0.0.0:33145
      - --advertise-rpc-addr=redpanda:33145
    volumes:
      - redpanda:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true'"]
      interval: 10s
      retries: 20
    deploy:
      resources: { limits: { memory: 1500m } }

  azurite:
    <<: *restart
    # Blob storage for receipt photos (Azure Blob's emulator; swap for a real Azure account via BLOB_CONNECTION_STRING).
    # Its own secret account key: Azurite's default key is public knowledge.
    image: mcr.microsoft.com/azure-storage/azurite:3.37.0
    command: ["azurite-blob", "--blobHost", "0.0.0.0", "--location", "/data", "--skipApiVersionCheck", "--loose"]
    environment:
      AZURITE_ACCOUNTS: kitty:${BLOB_ACCOUNT_KEY:?set BLOB_ACCOUNT_KEY}
    volumes:
      - azurite:/data
    deploy:
      resources: { limits: { memory: 256m } }

  ai-db-setup:
    # One-shot, every start: gives the ai service its own role, limited to schema "ai" (ai-db-setup.sql).
    image: pgvector/pgvector:pg17
    restart: "no"
    command: ["psql", "-v", "ai_password=${AI_DB_PASSWORD:?set AI_DB_PASSWORD}", "-f", "/setup/ai-db-setup.sql"]
    environment:
      PGHOST: postgres
      PGUSER: postgres
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ledger
    volumes:
      - ./ai-db-setup.sql:/setup/ai-db-setup.sql:ro
    depends_on:
      postgres: { condition: service_healthy }

  ai:
    <<: *restart
    image: ${KITTY_IMAGE_PREFIX}kitty-ai:${KITTY_TAG:-latest}
    environment:
      AI_KAFKA_BOOTSTRAP: redpanda:9092
      AI_SCHEMA_REGISTRY_URL: http://redpanda:8081
      AI_BLOB_CONNECTION_STRING: ${BLOB_CONNECTION_STRING:-DefaultEndpointsProtocol=http;AccountName=kitty;AccountKey=${BLOB_ACCOUNT_KEY};BlobEndpoint=http://azurite:10000/kitty;}
      AI_POSTGRES_DSN: host=postgres port=5432 dbname=ledger user=ai password=${AI_DB_PASSWORD}
      # Empty: scans fail fast with "type the items" and everything else keeps working.
      AI_GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    healthcheck:
      # 503 when a receipt reader has stopped.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    depends_on:
      ai-db-setup: { condition: service_completed_successfully }
      redpanda: { condition: service_healthy }
      azurite: { condition: service_started }
    deploy:
      resources: { limits: { memory: 1500m } }

  pulse-db-setup:
    # One-shot, every start: gives pulse its own role, limited to schema "pulse" (pulse-db-setup.sql).
    image: pgvector/pgvector:pg17
    restart: "no"
    command: ["psql", "-v", "pulse_password=${PULSE_DB_PASSWORD:?set PULSE_DB_PASSWORD}", "-f", "/setup/pulse-db-setup.sql"]
    environment:
      PGHOST: postgres
      PGUSER: postgres
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ledger
    volumes:
      - ./pulse-db-setup.sql:/setup/pulse-db-setup.sql:ro
    depends_on:
      postgres: { condition: service_healthy }

  pulse:
    # Exchange rates (ECB, via Frankfurter) over gRPC for the ledger. Not exposed outside the compose network.
    <<: *restart
    image: ${KITTY_IMAGE_PREFIX}kitty-pulse:${KITTY_TAG:-latest}
    environment:
      PULSE_DATABASE_URL: postgres://pulse:${PULSE_DB_PASSWORD}@postgres:5432/ledger?sslmode=disable
      PULSE_PORT: "5090"
    healthcheck:
      test: ["CMD", "/pulse", "-health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      pulse-db-setup: { condition: service_completed_successfully }
    deploy:
      resources: { limits: { memory: 128m } }

  ledger:
    <<: *restart
    image: ${KITTY_IMAGE_PREFIX:?set KITTY_IMAGE_PREFIX}kitty-ledger:${KITTY_TAG:-latest}
    environment:
      ConnectionStrings__ledger: Host=postgres;Database=ledger;Username=postgres;Password=${POSTGRES_PASSWORD}
      Auth__Authority: https://${KITTY_HOST}/auth/realms/kitty
      Auth__Audience: kitty-ledger
      Ledger__MigrateOnStartup: "true"
      Ledger__TrustForwardedHeaders: "true" # only reachable through Caddy
      ConnectionStrings__redis: redis:6379 # SignalR backplane for live table updates
      ConnectionStrings__kafka: redpanda:9092
      Kafka__SchemaRegistryUrl: http://redpanda:8081
      ConnectionStrings__blobs: ${BLOB_CONNECTION_STRING:-DefaultEndpointsProtocol=http;AccountName=kitty;AccountKey=${BLOB_ACCOUNT_KEY};BlobEndpoint=http://azurite:10000/kitty;}
      # Browsers upload receipt photos through Caddy (same origin); unset when using real Azure Blob.
      Blob__PublicUrl: ${BLOB_PUBLIC_URL-https://${KITTY_HOST}/blob}
      Fx__Url: http://pulse:5090 # exchange rates (gRPC)
    depends_on:
      postgres: { condition: service_healthy }
      pulse: { condition: service_healthy }
      redis: { condition: service_healthy }
      redpanda: { condition: service_healthy }
      azurite: { condition: service_started }
    deploy:
      resources: { limits: { memory: 512m } }

  web:
    <<: *restart
    image: ${KITTY_IMAGE_PREFIX}kitty-web:${KITTY_TAG:-latest}
    environment:
      AUTH_URL: https://${KITTY_HOST}
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET}
      AUTH_TRUST_HOST: "true"
      AUTH_KEYCLOAK_ID: kitty-web
      AUTH_KEYCLOAK_SECRET: ${KITTY_WEB_CLIENT_SECRET}
      AUTH_KEYCLOAK_ISSUER: https://${KITTY_HOST}/auth/realms/kitty
      LEDGER_URL: http://ledger:8080
      TRUST_PROXY_HEADERS: "true" # only reachable through Caddy; passes guests' addresses on for the join limit
      # Browsers open the live table connection through Caddy (same origin, so no CORS needed).
      LEDGER_PUBLIC_URL: https://${KITTY_HOST}/api
      # The APK signing certificate's SHA-256, so invite and table links open in the Android app (optional).
      ANDROID_CERT_SHA256: ${ANDROID_CERT_SHA256:-}
    depends_on: [ledger, keycloak]
    deploy:
      resources: { limits: { memory: 512m } }

  caddy:
    <<: *restart
    image: caddy:2.11.9-alpine
    environment:
      KITTY_HOST: ${KITTY_HOST}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      default:
        # Containers resolve the public hostname to Caddy itself, so the web app and ledger
        # reach Keycloak at the same https issuer URL browsers use (no hairpin NAT needed).
        aliases: ["${KITTY_HOST}"]
    depends_on: [web, ledger, keycloak]
    deploy:
      resources: { limits: { memory: 128m } }

volumes:
  pgdata:
  redpanda:
  azurite:
  caddy-data:
  caddy-config:
