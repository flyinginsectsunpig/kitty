apiVersion: v1
kind: Service
metadata:
  name: redpanda
  labels:
    app.kubernetes.io/name: redpanda
spec:
  selector:
    app.kubernetes.io/name: redpanda
  ports:
    - name: kafka
      port: 9092
      targetPort: kafka
    - name: schema-registry
      port: 8081
      targetPort: schema-registry
    - name: rpc
      port: 33145
      targetPort: rpc
