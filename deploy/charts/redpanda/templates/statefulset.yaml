apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redpanda
  labels:
    app.kubernetes.io/name: redpanda
spec:
  serviceName: redpanda
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: redpanda
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redpanda
    spec:
      containers:
        - name: redpanda
          image: {{ .Values.image }}
          args: {{ toJson .Values.args }}
          ports:
            - name: kafka
              containerPort: 9092
            - name: schema-registry
              containerPort: 8081
            - name: rpc
              containerPort: 33145
          readinessProbe:
            exec:
              command: ["sh", "-c", "rpk cluster health | grep -E 'Healthy:.+true'"]
            periodSeconds: 10
            failureThreshold: 20
          resources:
            requests:
              cpu: 100m
              memory: {{ .Values.memory }}
            limits:
              memory: {{ .Values.memory }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/redpanda/data
  volumeClaimTemplates:
    - metadata:
        name: data
        annotations:
          helm.sh/resource-policy: keep
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-path
        resources:
          requests:
            storage: {{ .Values.storage }}
