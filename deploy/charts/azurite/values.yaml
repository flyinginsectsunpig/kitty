# Blob storage for receipt photos (Azure Blob's emulator), with its own secret account key: Azurite's default key is
# public knowledge.
image: mcr.microsoft.com/azure-storage/azurite:3.37.0
memory: 256Mi
storage: 5Gi
args: ["azurite-blob", "--blobHost", "0.0.0.0", "--location", "/data", "--skipApiVersionCheck", "--loose", "--silent"]
