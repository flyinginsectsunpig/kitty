# Answers 404 to everything. Traefik can't send a fixed response itself, so paths that must not reach a service
# (the Keycloak admin console, reading receipt photos) are routed here.
apiVersion: v1
kind: ConfigMap
metadata:
  name: edge-deny
  labels:
    app.kubernetes.io/name: edge-deny
data:
  Caddyfile: |
    {
      admin off
    }
    :8080 {
      respond 404
    }
---
apiVersion: v1
kind: Service
metadata:
  name: edge-deny
  labels:
    app.kubernetes.io/name: edge-deny
spec:
  selector:
    app.kubernetes.io/name: edge-deny
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: edge-deny
  labels:
    app.kubernetes.io/name: edge-deny
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: edge-deny
  template:
    metadata:
      labels:
        app.kubernetes.io/name: edge-deny
    spec:
      containers:
        - name: deny
          image: {{ .Values.deny.image }}
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            tcpSocket:
              port: http
          resources:
            requests:
              cpu: 5m
              memory: {{ .Values.deny.memory }}
            limits:
              memory: {{ .Values.deny.memory }}
          volumeMounts:
            - name: config
              mountPath: /etc/caddy/Caddyfile
              subPath: Caddyfile
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: edge-deny
